<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="stylesheet" href="src/style.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rockefeller Tab</title>
  </head>
  <body>
    <h1 id="clock">5:41 PM</h1>
    <form id="searchbar" action="https://www.google.com/search" method="GET">
      <input type="text" placeholder="Search..." name="q" />
      <button type="submit">Submit</button>
    </form>
    <div id="mars-app" class="app">
      <div class="app-header">
        <h3 style="margin: 0;">Mars Weather</h3>
        <h4 id="mars-sol" style="margin: 0;">Loading...</h4>
      </div>
      <div class="app-content">
        <p id="mars-season"></p>
        <p id="mars-at"></p>
        <p id="mars-hws"></p>
        <p id="mars-pre"></p>
      </div>
    </div>
    <script type="module" src="src/main.js"></script>
  </body>
</html>
